<!doctype html>
<html lang="en">
    <head>
        <!-- ================ Meta Setup ================ -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="theme-color" content="#06C5C8" />
        <title>MeneYou</title>
        <link rel="icon" href="/img/logo.png" type="image/png" />
    </head>
    <body class="bg-[#020B0E] text-white min-h-screen">
        <!-- ================ React App Root ================ -->
        <div id="app" class="relative z-10"></div>

        <!-- ================ Responsive Content Welcome ================ -->
        <div class="m-5 p-5 relative -z-10 md:mt-20 md:ml-8 md:bg-[#041419] md:p-8 md:rounded-2xl md:border md:border-[#0a252c] md:w-1/2 md:h-1/2 md:overflow-y-auto">
            
            <!-- ================ Welcome Badge ================ -->
            <div
                class="animate-fade-up inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#0a1c22] border border-[#12353d]"
            >
                <span class="w-2 h-2 rounded-full bg-[#06C5C8]"></span>
                <span class="font-Inter font-medium text-[#06C5C8]"> Welcome </span>
            </div>

            <!-- ================ Main Heading ================ -->
            <h1
                class="animate-fade-up text-white font-Inter text-3xl font-semibold mt-6 md:mt-8 w-40 md:w-auto"
            >
                <span class="header-style"> Build</span>
                Something Amazing.
            </h1>

            <!-- ================ Scroll Container & Text ================ -->
            <div id="scroll-container" class="mt-6 md:mt-8">
                <div class="scroll-item">
                    <p class="text-gray-300 font-Inter">
                        Hello, I am Meraj and this is my first project.
                    </p>
                </div>
                
                <div class="scroll-item mt-4">
                    <p class="text-gray-300 font-Inter text-sm leading-relaxed">
                        MeneYou is a minimal portfolio showcase focusing on a sleek dark UI, high contrast accents, and smooth responsive design across all devices.
                    </p>
                </div>

                <!-- ================ Action Buttons ================ -->
                <div class="flex flex-col md:flex-row gap-4 mt-8 md:ml-20">
                    <div
                        class="btn-click scroll-item border-[#08B9BE] border flex items-center justify-center w-full md:w-48 h-12 bg-linear-to-br from-[#0AB5BE] to-[#0696A3] rounded-xl"
                    >
                        <button class="text-white font-medium cursor-pointer">Go To Home</button>
                    </div>
                    <div
                        class="btn-click scroll-item border-[#08B9BE] border flex items-center justify-center w-full md:w-48 h-12 bg-none rounded-xl"
                    >
                        <button class="text-white font-medium cursor-pointer">Explore Projects</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- ================ Scripts ================ -->
        <script type="module" src="/src/components/navbar-opener.jsx"></script>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
